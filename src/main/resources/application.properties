spring.application.name=bff
server.port=${PORT:9000}

# Local secrets (ANTHROPIC_API_KEY, MOTOR_TOKEN...) in bff/.env, ignored by git
spring.config.import=optional:file:.env[.properties],optional:file:bff/.env[.properties]

# Motor (domain service)
motor.url=${MOTOR_URL:http://localhost:9200}
motor.token=${MOTOR_TOKEN:}
# Port of the OCPP gateway as seen by browsers and chargers (OCPP URL, emulator link)
motor.public-port=${OCPP_PUBLIC_PORT:9100}
# Public base URL of the gateway behind a reverse proxy (e.g. https://geu.fahnlabs.cl); overrides the port above
motor.public-url=${OCPP_PUBLIC_URL:}
motor.timeout=15s
motor.command-timeout=45s

# Assistant
assistant.model=${AGENT_MODEL:claude-opus-5-5}
assistant.api-key=${ANTHROPIC_API_KEY:}
# Free alternative: Google Gemini (used when ANTHROPIC_API_KEY is empty and GEMINI_API_KEY is set)
assistant.gemini-api-key=${GEMINI_API_KEY:}
assistant.gemini-model=${GEMINI_MODEL:gemini-3.8-flash}
# Tried in order when the main model is busy (503/429), retired (404) or times out
assistant.gemini-fallback-models=${GEMINI_FALLBACK_MODELS:gemini-flash-latest,gemini-3.5-flash-lite,gemini-flash-lite-latest}
assistant.max-iterations=14

# Compiled Angular front served as a SPA (relative to the working directory)
front.dir=${FRONT_DIR:front/dist/front/browser}

# RFC 9457 problem details for framework errors
spring.mvc.problemdetails.enabled=true
server.error.include-message=always

# OpenAPI (springdoc): spec at /v3/api-docs, Swagger UI at /swagger-ui.html
springdoc.api-docs.version=openapi_3_1
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=EV yard power control BFF
info.app.author=Fabián Hidalgo
